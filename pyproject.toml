[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoheal-ai"
version = "1.0.0"
description = "Autonomous Self-Healing Test Automation & Root Cause Analysis Platform"
readme = "README.md"
authors = [{ name = "Jedidiah Katta", email = "jedidiahkatta@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.5.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.2",
    "rich>=13.7.0",
    "click>=8.1.7",
    "requests>=2.31.0",
    "httpx>=0.26.0",
    "pytest>=8.0.0",
]

[project.scripts]
autoheal = "autoheal.cli:main"

[tool.setuptools.packages.find]
include = ["autoheal*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
