name: AutoHeal-AI Automation CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Pytest Suite with AutoHeal Runtime Interceptor
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

      - name: Run Full AutoHeal Demonstration & Telemetry Generator
        env:
          PYTHONPATH: .
        run: |
          python -m autoheal.cli demo --headless

      - name: Upload HTML Test Report & Suggested Patches
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoheal-telemetry-artifacts
          path: |
            artifacts/report.html
            artifacts/telemetry_report.json
            artifacts/suggested_selector_patch.diff
